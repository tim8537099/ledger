<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="帳本">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dde3de;
  --accent:#2f6b57; --accent-ink:#ffffff; --out:#b4533c; --in:#2f7d4f;
  --c1:#2f6b57; --c2:#d08a3a; --c3:#5a7fb8; --c4:#b4533c; --c5:#8a6bb0; --c6:#4fa3a0; --c7:#9aa39d;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a17; --surface:#1c2420; --fg:#e6ebe7; --muted:#9aa59f; --line:#2c3631;
  --accent:#6fb89a; --accent-ink:#0f1a15; --out:#e48a72; --in:#74c48f;
  --c1:#6fb89a; --c2:#e3a85e; --c3:#86a6dc; --c4:#e48a72; --c5:#b195d6; --c6:#6cc4c0; --c7:#7d8781;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.month{display:flex;align-items:center;gap:4px}
.month button{background:none;border:1px solid var(--line);color:var(--fg);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
.month span{min-width:96px;text-align:center;font-weight:500}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.totals{display:flex;flex-direction:column;gap:10px;min-width:0}
.trow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.trow .lab{font-size:12px;color:var(--muted);letter-spacing:.08em}
.trow .val{font-size:17px}
.trow.bal{border-top:1px dashed var(--line);padding-top:10px}
.trow.bal .val{font-size:22px;font-weight:500}
.out{color:var(--out)} .in{color:var(--in)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend b{font-weight:400;color:var(--muted)}
@media (max-width:380px){.summary{grid-template-columns:1fr}.donut{justify-self:center}}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amt span{color:var(--muted);font-family:var(--f-num)}
.amt input[type=text]{border:0;border-radius:0;padding:0;background:none;color:var(--fg);font-family:var(--f-num);font-size:30px;width:100%;min-width:0;outline:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);padding:5px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.row2 input{width:100%;min-width:0}
input[type=date],input[type=text]{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}
.submit{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.submit:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--muted);min-height:1em;margin:0}
.msg.err{color:var(--out)}
.ledger{display:flex;flex-direction:column;gap:16px}
.day h3{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin:0 0 6px;display:flex;justify-content:space-between}
.day ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.day li{border-top:1px solid var(--line)}
.day li:first-child{border-top:0}
.entry{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.entry i{width:10px;height:10px;border-radius:2px}
.entry .t{min-width:0}
.entry .t div:first-child{font-weight:500}
.entry .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.entry .a{font-size:16px}
.confirm{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 11px}
.confirm button{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--fg)}
.confirm .del{background:var(--out);border-color:var(--out);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.status{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.status button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px}
[hidden]{display:none!important}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.quick label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.quick .qrow{display:flex;gap:8px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
.quick button{border:0;border-radius:8px;padding:0 14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.quick .hint{font-size:12px;color:var(--muted);margin:0}
.quick .result{font-size:13px;margin:0;padding:8px 10px;border-radius:8px;background:var(--bg)}
.quick .result.err{color:var(--out)}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.lock h2{margin:0;font-size:17px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
.status .link{color:var(--muted)}
</style>
<title>我們的帳本</title>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我們的帳本</h1>
    <div class="month">
      <button id="prev" aria-label="上個月">‹</button>
      <span id="monthLabel" class="num"></span>
      <button id="next" aria-label="下個月">›</button>
    </div>
  </header>

  <section class="lock" id="lock" hidden>
    <h2>輸入通關密碼</h2>
    <p id="lockMsg">第一次使用請輸入你們設定的通關密碼，這支手機之後會記住。</p>
    <input id="key" type="password" autocomplete="current-password" aria-label="通關密碼">
    <button class="submit" id="unlock" type="button">開始記帳</button>
  </section>

  <div id="main">
  <section class="summary" aria-label="本月總覽">
    <svg class="donut" id="donut" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="支出分類圓餅圖"></svg>
    <div class="totals">
      <div class="trow"><span class="lab">支出</span><span class="val num out" id="tOut">0</span></div>
      <div class="trow"><span class="lab">收入</span><span class="val num in" id="tIn">0</span></div>
      <div class="trow bal"><span class="lab">結餘</span><span class="val num" id="tBal">0</span></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="quick" aria-label="說一句話記帳">
    <label for="quickText">說一句話記帳</label>
    <div class="qrow">
      <input id="quickText" type="text" enterkeyhint="done" placeholder="例如：中午便當 120 付現金" autocomplete="off">
      <button type="button" id="quickGo">填入</button>
    </div>
    <p class="hint">點輸入框後，按鍵盤上的麥克風說話。判斷結果會填進下方表單，確認沒錯再按「記一筆」。</p>
    <p class="result" id="quickResult" hidden></p>
  </section>

  <form id="form" autocomplete="off">
    <div class="seg" role="group" aria-label="收支類型">
      <button type="button" id="typeOut" aria-pressed="true">支出</button>
      <button type="button" id="typeIn" aria-pressed="false">收入</button>
    </div>
    <div class="amt"><span>NT$</span><input id="amount" type="text" inputmode="numeric" placeholder="0" aria-label="金額"></div>
    <div class="field"><label>分類</label><div class="chips" id="cats"></div></div>
    <div class="field" id="methodField"><label>付款方式</label><div class="chips" id="methods"></div></div>
    <div class="row2">
      <div class="field"><label for="date">日期</label><input id="date" type="date"></div>
      <div class="field"><label for="note">備註</label><input id="note" type="text" placeholder="例如：午餐便當" maxlength="60"></div>
    </div>
    <div class="field"><label for="who">記錄人（這支手機會記住）</label><input id="who" type="text" placeholder="例如：應廷" maxlength="20"></div>
    <button class="submit" id="submit" type="submit">記一筆</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>

  <div class="status"><span id="sync">讀取中…</span><button type="button" id="refresh">重新整理</button></div>
  <section class="ledger" id="ledger" aria-label="明細"></section>
  <div class="status"><span></span><button type="button" class="link" id="logout">更換通關密碼</button></div>
  </div>
</div>

<script>
// ===== 語音記帳：把一句話拆成欄位（規則判斷） =====
const QP_CN_DIGIT={"零":0,"〇":0,"一":1,"二":2,"兩":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const QP_CN_UNIT={"十":10,"百":100,"千":1000,"萬":10000,"万":10000};
// 「一千二」「三百五十」「兩萬三」「1千2」「1.5萬」這類寫法轉成數字
function qpNum(str){
  str=String(str).replace(/,/g,"");
  if(/^\d+(\.\d+)?$/.test(str))return parseFloat(str);
  let total=0,section=0,num=null,lastUnit=1,prevUnit=false;
  const chars=[...str];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i];
    if(/[\d.]/.test(ch)){let j=i;while(j<chars.length&&/[\d.]/.test(chars[j]))j++;num=parseFloat(chars.slice(i,j).join(""));i=j-1;continue}
    if(ch in QP_CN_DIGIT){if(QP_CN_DIGIT[ch]===0){prevUnit=false;num=null;continue}num=QP_CN_DIGIT[ch];continue}
    if(ch in QP_CN_UNIT){const u=QP_CN_UNIT[ch];
      if(u===10000){total+=((section+(num===null?0:num))||1)*10000;section=0;num=null;lastUnit=10000;prevUnit=true;continue}
      section+=(num===null?1:num)*u;num=null;lastUnit=u;prevUnit=true;continue}
  }
  // 「一千二」的「二」代表兩百；「兩萬三」的「三」代表三千
  if(num!==null)section+=(prevUnit&&lastUnit>=100)?num*lastUnit/10:num;
  return total+section;
}
const QP_NUM="[\\d.,零〇一二兩两三四五六七八九十百千萬万]+";
const QP_CATS={
  "餐飲":["早餐","午餐","晚餐","宵夜","消夜","早午餐","便當","吃飯","吃","飯","麵","咖啡","飲料","手搖","珍奶","奶茶","火鍋","餐廳","外送","ubereats","uber eats","foodpanda","熊貓","麥當勞","肯德基","星巴克","點心","甜點","水果","滷味","雞排","小吃","聚餐","燒肉","拉麵","壽司"],
  "交通":["捷運","公車","客運","計程車","小黃","uber","加油","油錢","停車","高鐵","台鐵","火車","機票","悠遊卡加值","過路費","etc","機車","洗車","保養"],
  "購物":["買","衣服","褲子","鞋","包包","網購","蝦皮","momo","日用品","衛生紙","化妝品","保養品","3c","家樂福","全聯","好市多","costco","寶雅","大創","屈臣氏","康是美"],
  "居家":["房租","租金","水費","電費","瓦斯","網路費","電話費","手機費","管理費","家具","清潔","修理"],
  "娛樂":["電影","ktv","唱歌","遊戲","旅遊","旅行","門票","演唱會","netflix","spotify","訂閱","健身房","按摩"],
  "醫療":["看醫生","看病","診所","醫院","藥局","藥","掛號","牙醫","牙齒","健檢","眼科"],
  "薪資":["薪水","薪資","月薪","發薪"],
  "獎金":["獎金","年終","分紅","績效獎金"],
  "投資":["股利","股息","配息","利息","股票","賣股","基金","獲利"]
};
const QP_INCOME_WORDS=["收入","入帳","領到","領了","收到","賺","進帳"];
const QP_METHODS={
  "現金":["現金","付現"],
  "信用卡":["信用卡","刷卡","刷"],
  "行動支付":["行動支付","line pay","linepay","街口","apple pay","applepay","悠遊付","全支付","台灣pay","pi錢包","icash pay","全盈"],
  "轉帳":["轉帳","匯款"]
};
function qpLongest(text,table){let best=null,len=0;
  for(const k in table)for(const w of table[k]){if(w.length>len&&text.includes(w)){best=k;len=w.length}}return best}
function qpDateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function parseSentence(raw,now){
  now=now||new Date();
  let t=String(raw||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，。、！？\s]+/g," ").trim();
  const low=t.toLowerCase();
  let rest=t;
  // 日期
  let date=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dateHit=false,m;
  const rel={"大前天":-3,"前天":-2,"昨天":-1,"昨晚":-1,"今天":0,"今晚":0,"今早":0};
  for(const w of ["大前天","前天","昨天","昨晚","今天","今晚","今早"]){if(rest.includes(w)){date.setDate(date.getDate()+rel[w]);rest=rest.replace(w," ");dateHit=true;break}}
  if(!dateHit&&(m=rest.match(new RegExp("("+QP_NUM+")月("+QP_NUM+")[日號号]?")))){
    const mo=qpNum(m[1]),da=qpNum(m[2]);
    if(mo>=1&&mo<=12&&da>=1&&da<=31){date=new Date(now.getFullYear(),mo-1,da);if(date>now)date.setFullYear(now.getFullYear()-1);rest=rest.replace(m[0]," ");dateHit=true}}
  if(!dateHit&&(m=rest.match(new RegExp("("+QP_NUM+")[號号]")))){
    const da=qpNum(m[1]);if(da>=1&&da<=31){date=new Date(now.getFullYear(),now.getMonth(),da);if(date>now)date.setMonth(date.getMonth()-1);rest=rest.replace(m[0]," ");dateHit=true}}
  // 金額：優先找帶「元／塊」的，其次「花了／付了」後面的數字，最後任何數字
  let amount=null;
  const pats=[
    new RegExp("(?:總共|一共|共|花了|花|付了|付|刷了)?\\s*(?:NT\\$?|\\$)?\\s*("+QP_NUM+")\\s*(?:塊錢|塊|元|圓|塊台幣|台幣|NT)","i"),
    new RegExp("(?:總共|一共|共|花了|花|付了|刷了)\\s*(?:NT\\$?|\\$)?\\s*("+QP_NUM+")","i"),
    new RegExp("(?:NT\\$?|\\$)\\s*("+QP_NUM+")","i"),
    /(\d[\d.,]*)/,
    new RegExp("((?:[零〇一二兩两三四五六七八九]?[十百千萬万])+[零〇一二兩两三四五六七八九]?)")
  ];
  for(const p of pats){const mm=rest.match(p);if(mm){const v=qpNum(mm[1]);if(v>0){amount=Math.round(v);rest=rest.replace(mm[0]," ");break}}}
  // 收入或支出、分類
  const restLow=rest.toLowerCase();
  let category=qpLongest(restLow,QP_CATS);
  const incomeCats=["薪資","獎金","投資"];
  let type=(incomeCats.includes(category)||QP_INCOME_WORDS.some(w=>restLow.includes(w)))?"in":"out";
  if(type==="in"&&!incomeCats.includes(category))category="其他";
  if(type==="out"&&!category)category="其他";
  // 付款方式
  let method=type==="out"?qpLongest(restLow,QP_METHODS):null;
  // 備註：去掉付款方式和連接詞後剩下的文字
  let note=rest;
  if(method){for(const w of QP_METHODS[method].slice().sort((a,b)=>b.length-a.length)){note=note.replace(new RegExp("(?:用|付|是|拿)?"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i")," ")}}
  note=note.replace(/(我|今天|中午|晚上|早上)?\s*(收到|領到|領了|入帳|進帳)\s*/g," ");
  note=note.replace(/\s+/g," ").trim().replace(/^(了|的|用|付|是|在)\s*/,"").replace(/\s*(了|的|用|付|是|在|刷)$/,"").trim();
  if(!note&&category!=="其他")note="";
  return {type,amount,category,method,date:qpDateStr(date),note:note.slice(0,60)};
}

// ▼▼▼ 把引號裡的文字換成你的 Apps Script 網頁應用程式網址（https://script.google.com/macros/s/.../exec）▼▼▼
const API_URL = "https://script.google.com/macros/s/AKfycbwLSmlPXJoCcoC0zCFwHIajoAhanwY-FoQUnoXbc0zEHxpYXuWjTbOHKcKZDjO203xpTw/exec";
// ▲▲▲

const CATS={out:["餐飲","交通","購物","居家","娛樂","醫療","其他"],in:["薪資","獎金","投資","其他"]};
const METHODS=["現金","信用卡","行動支付","轉帳"];
const COLOR={"餐飲":"--c1","交通":"--c3","購物":"--c2","居家":"--c6","娛樂":"--c5","醫療":"--c4","其他":"--c7","薪資":"--c1","獎金":"--c2","投資":"--c3"};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("zh-TW");
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};

let state={type:"out",cat:"餐飲",method:"現金"};
let view=new Date(); view.setDate(1);
let entries=[]; let openId=null; let busy=false;

try{ $("who").value=localStorage.getItem("ledger-who")||""; }catch(e){}
$("who").addEventListener("change",()=>{try{localStorage.setItem("ledger-who",$("who").value.trim())}catch(e){}});

function chips(el,list,key){
  el.innerHTML="";
  list.forEach(v=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v;
    b.setAttribute("aria-pressed",String(state[key]===v));
    b.onclick=()=>{state[key]=v;chips(el,list,key)};el.appendChild(b)});
}
function setType(t){state.type=t;state.cat=CATS[t][0];
  $("typeOut").setAttribute("aria-pressed",String(t==="out"));$("typeIn").setAttribute("aria-pressed",String(t==="in"));
  chips($("cats"),CATS[t],"cat");$("methodField").hidden=(t==="in");}
$("typeOut").onclick=()=>setType("out");$("typeIn").onclick=()=>setType("in");
chips($("methods"),METHODS,"method");setType("out");
$("date").value=todayStr();
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};

function monthKey(){return view.getFullYear()+"-"+pad(view.getMonth()+1)}

function drawDonut(byCat,total){
  const r=52,C=2*Math.PI*r;let off=0;
  let html='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="18"/>';
  if(total>0){byCat.forEach(([c,v])=>{const len=v/total*C;
    html+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var('+(COLOR[c]||"--c7")+')" stroke-width="18" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;});}
  html+='<text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-body)">本月支出</text>';
  html+='<text x="70" y="84" text-anchor="middle" font-size="14" fill="var(--fg)" font-family="var(--f-num)">'+fmt(total)+'</text>';
  $("donut").innerHTML=html;
}

function render(){
  $("monthLabel").textContent=view.getFullYear()+" 年 "+(view.getMonth()+1)+" 月";
  const mk=monthKey();const list=entries.filter(e=>e.date&&e.date.indexOf(mk)===0);
  let tOut=0,tIn=0;const cat={};
  list.forEach(e=>{if(e.type==="in")tIn+=e.amount;else{tOut+=e.amount;cat[e.category]=(cat[e.category]||0)+e.amount}});
  $("tOut").textContent=fmt(tOut);$("tIn").textContent=fmt(tIn);
  const bal=tIn-tOut;$("tBal").textContent=(bal<0?"−":"")+fmt(Math.abs(bal));$("tBal").className="val num "+(bal<0?"out":"");
  const byCat=Object.entries(cat).sort((a,b)=>b[1]-a[1]);drawDonut(byCat,tOut);
  const lg=$("legend");lg.innerHTML="";
  if(byCat.length){byCat.forEach(([c,v])=>{const s=document.createElement("span");
    s.innerHTML='<i style="background:var('+(COLOR[c]||"--c7")+')"></i><span></span> <b class="num">'+Math.round(v/tOut*100)+'%</b>';
    s.children[1].textContent=c;lg.appendChild(s)});}
  else{lg.innerHTML='<span style="color:var(--muted)">這個月還沒有支出</span>'}

  const L=$("ledger");L.innerHTML="";
  if(!list.length){L.innerHTML='<div class="empty"><strong>'+(mk===todayStr().slice(0,7)?"這個月還沒有紀錄":"這個月沒有紀錄")+'</strong>在上方輸入金額、選分類，按「記一筆」就會出現在這裡，兩個人記的都會一起顯示。</div>';return}
  const days={};list.forEach(e=>{(days[e.date]=days[e.date]||[]).push(e)});
  const wk="日一二三四五六";
  Object.keys(days).sort().reverse().forEach(d=>{
    const items=days[d].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const dayOut=items.filter(e=>e.type!=="in").reduce((s,e)=>s+e.amount,0);
    const dt=new Date(d+"T00:00:00");
    const sec=document.createElement("div");sec.className="day";
    sec.innerHTML='<h3><span>'+(dt.getMonth()+1)+'/'+dt.getDate()+'（'+wk[dt.getDay()]+'）</span><span class="num">'+(dayOut?"支出 "+fmt(dayOut):"")+'</span></h3>';
    const ul=document.createElement("ul");
    items.forEach(e=>{
      const li=document.createElement("li");
      const meta=[e.type==="in"?"收入":e.method,e.note,e.by&&("由 "+e.by+" 記")].filter(Boolean).join(" · ");
      const btn=document.createElement("button");btn.className="entry";btn.type="button";
      btn.innerHTML='<i style="background:var('+(COLOR[e.category]||"--c7")+')"></i><div class="t"><div></div><div class="meta"></div></div><span class="a num '+(e.type==="in"?"in":"out")+'">'+(e.type==="in"?"+":"−")+fmt(e.amount)+'</span>';
      btn.querySelector(".t div").textContent=e.category;btn.querySelector(".meta").textContent=meta;
      btn.onclick=()=>{openId=openId===e.id?null:e.id;render()};
      li.appendChild(btn);
      if(openId===e.id){const c=document.createElement("div");c.className="confirm";
        c.innerHTML='<button type="button">取消</button><button type="button" class="del">刪除這筆</button>';
        c.children[0].onclick=()=>{openId=null;render()};
        c.children[1].onclick=()=>{c.children[1].disabled=true;
          api({action:"delete",id:e.id}).then(r=>{openId=null;gotData(r)})
            .catch(err=>{c.children[1].disabled=false;if(err.message!=="wrong_key")say("刪除失敗，請稍後再試一次",true)})};
        li.appendChild(c)}
      ul.appendChild(li)});
    sec.appendChild(ul);L.appendChild(sec)});
}

function say(t,err){const m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"");}
function gotData(r){entries=r||[];const d=new Date();$("sync").textContent="已同步 "+pad(d.getHours())+":"+pad(d.getMinutes());render()}
let KEY="";try{KEY=localStorage.getItem("ledger-key")||""}catch(e){}
function showLock(msg){$("lock").hidden=false;$("main").hidden=true;if(msg)$("lockMsg").textContent=msg;}
function showMain(){$("lock").hidden=true;$("main").hidden=false;}
async function api(body){
  if(API_URL.indexOf("https://")!==0)throw new Error("no_url");
  body.key=KEY;
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const data=await res.json();
  if(!data.ok){
    if(data.error==="wrong_key"){try{localStorage.removeItem("ledger-key")}catch(e){}KEY="";showLock("通關密碼不對，請再輸入一次。");}
    if(data.error==="passcode_not_set")showLock("後端還沒設定通關密碼：請在 Apps Script 的 Code.gs 第一段改好密碼，並重新部署。");
    throw new Error(data.error||"server");
  }
  return data.entries;
}
function load(){
  if(!KEY){showLock();return}
  $("sync").textContent="讀取中…";
  return api({action:"list"}).then(r=>{showMain();gotData(r)})
    .catch(err=>{if(err.message==="no_url")$("sync").textContent="App 還沒設定後端網址";else if(err.message!=="wrong_key"&&err.message!=="passcode_not_set")$("sync").textContent="讀取失敗，請檢查網路後按重新整理";});
}
$("unlock").onclick=()=>{const k=$("key").value.trim();if(!k)return;KEY=k;try{localStorage.setItem("ledger-key",k)}catch(e){}$("key").value="";$("lockMsg").textContent="確認中…";load()};
$("key").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlock").click()});
$("logout").onclick=()=>{try{localStorage.removeItem("ledger-key")}catch(e){}KEY="";showLock("請輸入新的通關密碼。")};
$("refresh").onclick=load;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});

// 語音記帳：判斷後填入表單，讓使用者確認
function quickFill(){
  const text=$("quickText").value.trim();const out=$("quickResult");
  if(!text){$("quickText").focus();return}
  const r=parseSentence(text);
  setType(r.type);
  if(r.category&&CATS[r.type].includes(r.category)){state.cat=r.category;chips($("cats"),CATS[r.type],"cat")}
  if(r.method){state.method=r.method;chips($("methods"),METHODS,"method")}
  if(r.amount)$("amount").value=String(r.amount);
  $("date").value=r.date;
  $("note").value=r.note||"";
  const d=new Date(r.date+"T00:00:00");
  const parts=[(r.type==="in"?"收入":"支出")+"・"+r.category,
    r.amount?fmt(r.amount)+" 元":"金額沒聽到",
    r.type==="in"?"":(r.method||state.method)+(r.method?"":"（沿用）"),
    (d.getMonth()+1)+"/"+d.getDate(),
    r.note?"備註「"+r.note+"」":""].filter(Boolean);
  out.hidden=false;
  out.className="result"+(r.amount?"":" err");
  out.textContent=r.amount?"已填入："+parts.join("・")+"。沒問題就按「記一筆」。":"沒有找到金額，請在下方表單補上金額。已填入："+parts.join("・");
  const f=$("form");f.classList.remove("flash");void f.offsetWidth;f.classList.add("flash");
  $("quickText").blur();
}
$("quickGo").onclick=quickFill;
$("quickText").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();quickFill()}});

$("amount").addEventListener("input",e=>{e.target.value=e.target.value.replace(/[^\d]/g,"").slice(0,9)});
$("form").addEventListener("submit",ev=>{
  ev.preventDefault();if(busy)return;
  const amount=parseInt($("amount").value,10);
  if(!amount||amount<=0){say("請先輸入金額",true);$("amount").focus();return}
  const date=$("date").value||todayStr();
  const rec={type:state.type,amount:amount,category:state.cat,method:state.type==="in"?"":state.method,note:$("note").value.trim(),date:date,by:$("who").value.trim()};
  try{localStorage.setItem("ledger-who",rec.by)}catch(e){}
  busy=true;$("submit").disabled=true;say("儲存中…");
  api({action:"add",rec:rec})
    .then(r=>{busy=false;$("submit").disabled=false;$("amount").value="";$("note").value="";
      say("已記下 "+rec.category+" "+fmt(amount)+" 元");$("quickText").value="";$("quickResult").hidden=true;
      const d=new Date(date+"T00:00:00");if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear()){view=new Date(d.getFullYear(),d.getMonth(),1)}
      gotData(r)})
    .catch(err=>{busy=false;$("submit").disabled=false;if(err.message!=="wrong_key")say("沒有存成功，請再按一次",true)});
});

render();load();
</script>
</body>
</html>
